minimumReleaseAge: 4320
strictDepBuilds: true
blockExoticSubdeps: true

# better-sqlite3 ships N-API prebuilds; skip the implicit node-gyp rebuild.
allowBuilds:
  better-sqlite3@13.0.3: false

# Keep the release helper and its internal dependency available together.
minimumReleaseAgeExclude:
  - '@tryghost/pro-ship'
  - '@tryghost/root-utils'

overrides:
  underscore: 1.13.8
